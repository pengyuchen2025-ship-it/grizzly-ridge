<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>灰岭之夜</title>
<style>
  :root { --red:#e0303a; --amber:#ffb02e; --ink:#0b0d12; --paper:#f2efe6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#07080c; color:var(--paper);
    font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100vw; height:100vh; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 2px 0 #000, 0 0 6px #000; }
  #hud-top-left { left:16px; top:14px; width:min(300px, 46vw); }
  .bar { height:14px; background:#1a0d0f; border:2px solid #000; box-shadow:0 0 0 1px #5a2a2e; position:relative; overflow:hidden; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#ff5560,#b3121d); transition:width .15s; }
  .label { font-size:12px; letter-spacing:1px; opacity:.85; margin:6px 0 3px; font-weight:700; }
  #size-bar > i { background:linear-gradient(#ffd27a,#d98a00); }
  #size-bar.ready > i { background:linear-gradient(#ff7a3d,#d1361b); }
  #hud-top-right { right:16px; top:12px; text-align:right; }
  #timer { font-size:30px; font-weight:900; font-variant-numeric:tabular-nums; }
  #stars { font-size:20px; letter-spacing:2px; color:#3a3f4b; }
  #stars b { color:var(--amber); font-weight:400; }
  #wave-label { font-size:12px; opacity:.8; margin-top:2px; }
  #hud-bottom-left { left:16px; bottom:14px; font-size:13px; line-height:1.6; }
  #hud-bottom-left b { font-size:20px; color:#fff; }
  #center-msg { left:50%; top:22%; transform:translateX(-50%); text-align:center; font-size:clamp(22px,4.4vw,44px); font-weight:900; color:#fff;
    letter-spacing:2px; opacity:0; transition:opacity .25s, transform .25s; white-space:nowrap; }
  #center-msg.show { opacity:1; transform:translateX(-50%) scale(1.04); }
  #center-msg small { display:block; font-size:.42em; font-weight:700; color:var(--amber); letter-spacing:1px; margin-top:6px; }
  #vignette { position:fixed; inset:0; pointer-events:none; box-shadow: inset 0 0 160px 40px rgba(200,0,0,0); transition: box-shadow .12s; }
  .float { position:fixed; pointer-events:none; font-weight:900; font-size:18px; color:#fff; text-shadow:0 2px 0 #000; animation: floatUp .9s ease-out forwards; white-space:nowrap; }
  .float.heal { color:#7dff8a; } .float.boom { color:var(--amber); font-size:24px; } .float.dmg { color:#ff6a6a; }
  @keyframes floatUp { from { transform:translate(-50%,0) scale(1.15); opacity:1; } to { transform:translate(-50%,-60px) scale(.9); opacity:0; } }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(40,6,10,.72), rgba(4,4,8,.94)); z-index:10; }
  .screen h1 { font-size:clamp(44px,10vw,96px); margin:0; letter-spacing:8px; color:#fff; text-shadow:0 0 24px #b3121d, 0 4px 0 #000; }
  .screen .sub { opacity:.85; margin:10px 0 26px; letter-spacing:2px; }
  .screen .keys { font-size:14px; opacity:.8; line-height:1.9; margin-bottom:24px; }
  .screen .keys kbd { display:inline-block; min-width:24px; padding:1px 6px; border:1px solid #888; border-bottom-width:3px; border-radius:4px; font-family:inherit; background:#14161c; }
  .btn { pointer-events:auto; font:inherit; font-size:20px; font-weight:900; letter-spacing:4px; padding:14px 42px; background:var(--red); color:#fff; border:3px solid #000;
    box-shadow:0 5px 0 #000, 0 0 30px rgba(224,48,58,.5); cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #000; }
  .credit { position:absolute; bottom:16px; font-size:12px; opacity:.55; letter-spacing:1px; }
  #result-stats { font-size:18px; line-height:2; margin:8px 0 26px; }
  #result-stats b { color:var(--amber); font-size:24px; }
  .hidden { display:none !important; }
  #touch-jump { position:fixed; right:22px; bottom:26px; width:84px; height:84px; border-radius:50%; background:rgba(224,48,58,.35); border:3px solid rgba(255,255,255,.5);
    color:#fff; font-weight:900; font-size:18px; display:none; align-items:center; justify-content:center; z-index:5; }
  #stick { position:fixed; width:110px; height:110px; border-radius:50%; border:2px solid rgba(255,255,255,.35); pointer-events:none; display:none; z-index:5; }
  #stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,255,255,.4); }
  @media (pointer:coarse) { #touch-jump { display:flex; } }
  #mute { position:fixed; right:16px; bottom:14px; pointer-events:auto; background:none; border:none; color:#fff; opacity:.6; font-size:20px; cursor:pointer; z-index:6; }
  @media (pointer:coarse) { #mute { bottom:auto; top:90px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>

<div class="hud" id="hud-top-left">
  <div class="label">生命</div>
  <div class="bar" id="hp-bar"><i style="width:100%"></i></div>
  <div class="label" id="size-label">体积 · 达到满格可压爆车辆</div>
  <div class="bar" id="size-bar"><i style="width:0%"></i></div>
</div>
<div class="hud" id="hud-top-right">
  <div id="timer">0:00</div>
  <div id="stars"></div>
  <div id="wave-label"></div>
</div>
<div class="hud" id="hud-bottom-left">
  吞噬 <b id="stat-eaten">0</b> 人 · 压爆 <b id="stat-cars">0</b> 车 · 击落 <b id="stat-helis">0</b> 架
</div>
<div class="hud" id="center-msg"></div>

<div id="stick"><i></i></div>
<div id="touch-jump">跳</div>
<button id="mute" title="静音 (M)">🔊</button>

<div class="screen" id="start-screen">
  <h1>灰岭之夜</h1>
  <div class="sub">病毒爆发之夜，你是那只怪物</div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 滚动 · <kbd>空格</kbd> 跳跃 · 贴着墙往前推 = 爬墙<br>
    吞下路人变大、回血 · 长得够大就能压爆警车 · 爬上楼顶跳起来撞毁直升机<br>
    手机：左边拖动移动，右下角按钮跳跃 · <kbd>P</kbd> 切换像素化
  </div>
  <button class="btn" id="start-btn">开 始</button>
  <div class="credit" id="loading">加载中…</div>
</div>

<div class="screen hidden" id="result-screen">
  <h1 style="font-size:clamp(36px,8vw,72px)">你倒下了</h1>
  <div id="result-stats"></div>
  <button class="btn" id="restart-btn">再来一次</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js?v=20261108091955"></script>
</body>
</html>
